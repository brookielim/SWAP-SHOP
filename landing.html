<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWAP & SHOP</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat+Underline:wght@400&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "Kyiv";
  src: url("Kyiv-Light.otf") format("opentype");
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #ffffff;
  font-family: "Kyiv", sans-serif;
  overflow: hidden;
}

.top-bar {
  height: 118px;
  border-bottom: 1px solid #000;
  background: #F0F0F0;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  z-index: 20;
}

.nav-left {
  position: absolute;
  left: 40px;
  top: 30px;
  display: flex;
  gap: 30px;
}

.nav-right {
  position: absolute;
  right: 40px;
  top: 30px;
  display: flex;
  gap: 20px;
  align-items: center;
}

.logo {
  font-family: "Montserrat Underline", sans-serif;
  font-size: 48px;
}

a {
  text-decoration: none;
  color: black;
}

.hero {
  height: calc(100vh - 118px);
  position: relative;
  overflow: hidden;
}

.hero-title {
  position: absolute;
  left: 64px;
  top: 58px;
  font-family: "Montserrat Underline", sans-serif;
  font-size: 118px;
  line-height: 1.05;
  margin: 0;
  z-index: 10;
}

.hero-sub {
  position: absolute;
  left: 58px;
  bottom: 115px;
  font-size: 30px;
  line-height: 1.35;
  z-index: 12;
}

.swap-demo {
  position: absolute;
  right: 60px;
  top: 120px;
  width: 680px;
  height: 540px;
  z-index: 5;
}

.demo-card {
  position: absolute;
  width: 390px;
  height: 390px;
  object-fit: contain;
}

.card-a {
  left: 40px;
  top: 20px;
  animation: swapA 4s infinite;
}

.card-b {
  right: 10px;
  top: 145px;
  animation: swapB 4s infinite;
}

.swap-symbol {
  position: absolute;
  left: 54%;
  top: 52%;
  width: 70px;
  transform: translate(-50%, -50%);
  z-index: 9;
  animation: pulse 1.4s infinite;
}

.login-btn {
  position: absolute;
  right: 70px;
  bottom: 60px;
  width: 170px;
  height: 58px;
  border: 1px solid #000;
  border-radius: 999px;
  background: rgba(217,217,217,0.4);
  font-family: "Kyiv", sans-serif;
  font-size: 24px;
  cursor: pointer;
  z-index: 15;
}

.login-btn:hover {
  background: #45FC47;
}

@keyframes swapA {
  0%, 40% {
    transform: translate(0, 0) rotate(-5deg) scale(1);
    opacity: 1;
    z-index: 8;
  }

  50%, 90% {
    transform: translate(230px, 115px) rotate(6deg) scale(0.92);
    opacity: 1;
    z-index: 6;
  }

  100% {
    transform: translate(0, 0) rotate(-5deg) scale(1);
    opacity: 1;
    z-index: 8;
  }
}

@keyframes swapB {
  0%, 40% {
    transform: translate(0, 0) rotate(6deg) scale(0.92);
    opacity: 1;
    z-index: 6;
  }

  50%, 90% {
    transform: translate(-230px, -115px) rotate(-5deg) scale(1);
    opacity: 1;
    z-index: 8;
  }

  100% {
    transform: translate(0, 0) rotate(6deg) scale(0.92);
    opacity: 1;
    z-index: 6;
  }
}

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.15); }
}
</style>
</head>

<body>

<header class="top-bar">
  <div class="nav-left">
    <a href="#">Home</a>
    <a href="#">About</a>
  </div>

  <div class="logo">SWAP & SHOP</div>

  <div class="nav-right">
    <a href="#">Search</a>
    <a href="#">
      <img src="Union.png" width="24">
    </a>
  </div>
</header>

<main class="hero">

  <h1 class="hero-title">
    TOO MANY<br>
    CLOTHES,<br>
    NOTHING<br>
    <span class="highlight">NEW?</span>
  </h1>

  <div class="hero-sub">
    Give your clothes a second life.<br>
    Swap, shop, and discover a new you.
  </div>

  <div class="swap-demo">
    <img src="2T1.png" class="demo-card card-a">
    <img src="2B2.png" class="demo-card card-b">
    <img src="swap.png" class="swap-symbol">
  </div>

  <button class="login-btn" onclick="location.href='index.html'">
    Login
  </button>

</main>

</body>
</html>
